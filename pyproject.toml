[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mprresponse"
version = "1.0.0"
description = "Exact nonlinear response and Kramers-Kronig relations of the Montbrio-Pazo-Roxin firing-rate equations"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Hugues Berry", email = "hugues.berry@inria.fr" },
  { name = "Leonardo Trujillo", email = "leonardo.trujillo@insa-lyon.fr" },
]
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "numba>=0.59",
  "matplotlib>=3.8",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: tests that run a (small) spiking network"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E741"]
